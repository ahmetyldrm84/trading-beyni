name: Bekçi

# Bot herhangi bir sebeple durmuşsa yarım saat içinde yeniden başlatır.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Bot çalışmıyorsa başlat
        run: |
          durum=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bot.yml/runs?per_page=10" --jq '[.workflow_runs[].status] | join(",")' || echo "okunamadi")
          echo "Son turların durumu: $durum"
          # Yalnızca gerçekten süren ya da sırada bekleyen bir tur varsa dokunma; emin değilsek başlat
          # (aynı anda iki tur çalışamaz: fazlası sırada bekler).
          if echo "$durum" | grep -Eq 'in_progress|queued|pending|waiting|requested'; then
            echo "Bot çalışıyor."
          else
            echo "Bot çalışmıyor, başlatılıyor."
            gh workflow run bot.yml --repo "$GITHUB_REPOSITORY" --ref main
          fi
